<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Visuel éditorial de démonstration">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#dfe3e0" />
      <stop offset="100%" stop-color="#dfe3e0" stop-opacity="0.72" />
    </linearGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="bruit" />
    <feColorMatrix in="bruit" type="saturate" values="0" />
    <feComponentTransfer><feFuncA type="linear" slope="0.055" /></feComponentTransfer>
  </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#fond)" />
  <rect x="544" y="0" width="512" height="900" fill="#8a9a92" opacity="0.55" />
         <circle cx="800" cy="306" r="272" fill="#14110f" opacity="0.82" />
         <rect x="672" y="414" width="256" height="414" fill="#14110f" opacity="0.82" />
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.9" />
</svg>
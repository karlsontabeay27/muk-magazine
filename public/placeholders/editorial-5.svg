<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="900" height="1200" role="img" aria-label="Visuel éditorial de démonstration">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f0e2dd" />
      <stop offset="100%" stop-color="#f0e2dd" stop-opacity="0.72" />
    </linearGradient>
  <filter id="grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="bruit" />
    <feColorMatrix in="bruit" type="saturate" values="0" />
    <feComponentTransfer><feFuncA type="linear" slope="0.055" /></feComponentTransfer>
  </filter>
  </defs>
  <rect width="900" height="1200" fill="url(#fond)" />
  <rect x="0" y="216" width="900" height="288" fill="#c9a227" opacity="0.7" />
           <rect x="0" y="744" width="900" height="96" fill="#241d18" opacity="0.85" />
           <circle cx="648" cy="624" r="180" fill="#241d18" opacity="0.16" />
  <rect width="900" height="1200" filter="url(#grain)" opacity="0.9" />
</svg>
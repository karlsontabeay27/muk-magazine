<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Visuel éditorial de démonstration">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#f0e2dd" />
      <stop offset="100%" stop-color="#f0e2dd" stop-opacity="0.72" />
